<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <title>Todinho de Maria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0d1b2a;display:flex;justify-content:center;align-items:center;
         height:100dvh;overflow:hidden;touch-action:none;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    canvas{display:block;image-rendering:auto}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ── CANVAS ───────────────────────────────── */
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
const W   = 400, H = 700;
function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  cv.width=W; cv.height=H;
  cv.style.width=W*s+'px'; cv.style.height=H*s+'px';
}
resize(); addEventListener('resize',resize);

/* ── ASSETS ──────────────────────────────── */
const IMG={};
let loaded=0;
const SRCS={
  pi:'assets/sprites/1_base.png',    pj:'assets/sprites/2_pulando.png',
  pa:'assets/sprites/3_ataque.png',  ph:'assets/sprites/4_dano.png',
  pd:'assets/sprites/5_gameover.png',
  w2:'assets/sprites/1_base_2.png', w3:'assets/sprites/1_base_3.png',
  w4:'assets/sprites/1_base_4.png', w5:'assets/sprites/1_base_5.png',
  w6:'assets/sprites/1_base_6.png',
  oa:'assets/obstacles/obs_a_buraco.png',
  ob:'assets/obstacles/obs_b_caixa.png',
  oc:'assets/obstacles/obs_c_pedra.png',
  il:'assets/items/item_livro.png',  ie:'assets/items/item_escudo.png',
  is:'assets/items/item_estrela.png',
  bf:'assets/backgrounds/bg_chao.png',
  bc:'assets/backgrounds/bg_cenario.png',
  bc2:'assets/backgrounds/bg_cenario_2.png',
  bc3:'assets/backgrounds/bg_cenario_3.png',
  t1:'assets/telas/tela_1.png',
};
const TOTAL=Object.keys(SRCS).length;
for(const[k,v]of Object.entries(SRCS)){
  const i=new Image();
  i.onload=i.onerror=()=>loaded++;
  i.src=v; IMG[k]=i;
}
const rdy=k=>IMG[k]?.complete&&IMG[k].naturalWidth>0;

/* ── CONSTANTS ───────────────────────────── */
const HUD_H  = 56;          // top bar
const CTL_Y  = 612;         // controls start
const CTL_H  = H - CTL_Y;  // 88px

// ── LANE CONFIG ── ajuste aqui quando os assets chegarem ──────────────────
const LANE = {
  y:     [430, 499, 575],  // Y dos pés por lane — calculado da imagem bg_chao (128px: y=20,58,100 → escala 1.8125)
  px:    [ 47,  65,  83],  // X do personagem por lane (perspectiva: longe → perto)
  roadY: 380,              // Y onde a estrada começa (topo do bloco único de chão)
};
const LY = LANE.y; // alias — restante do código não precisa mudar
const LC = 3;

const FLOOR_SPD = 0.65;   // velocidade do piso
// bg_cenario: 2062×763px → escala height→324px → exibido 875px → pan 475px até 600km (dist=60000)
const BG_SPD   = 475/36000; // fundo revela exatamente ao chegar em 600km

// Player
const PW=74, PH=94;
const JVY=-13, GR=0.7;   // jump velocity, gravity
const WALK_KEYS=['pi','w2','w3','w4','w5','w6']; // 6 frames de corrida
const WALK_SPD=60/12; // frames de jogo por frame de animação (12 FPS)

// Obstacle [width, height]
const OS={a:[96,36],b:[60,60],c:[72,52]};
const IW=48, IH=48;

// On-screen buttons
const B={
  u:{x:10, y:618,w:72,h:70},
  d:{x:88, y:618,w:72,h:70},
  j:{x:228,y:618,w:80,h:70},
  a:{x:314,y:618,w:76,h:70},
};

/* ── STATE ───────────────────────────────── */
const ST={MENU:0,HELP:1,PLAY:2,PAUSED:3,OVER:4,WIN:5,INTRO:6,PHASE_INTRO:7,PHASE_WIN:8};
const PHASES=[
  {num:1,name:'Brasil',   flag:'🇧🇷',sanctuary:'Santuário de Aparecida'},
  {num:2,name:'Portugal', flag:'🇵🇹',sanctuary:'Santuário de Fátima'},
  {num:3,name:'México',   flag:'🇲🇽',sanctuary:'Basílica de Guadalupe'},
];
let state=ST.MENU;
let hs=+localStorage.getItem('tdm_hs')||0;
let phase=1,phaseIntroT=0;
let pl,obs,its,parts,score,spd,obsT,obsI,itmT,itmI;
let shield,shT,flash,flashT,bgOff,dist,starMode,starT,toast,toastT;
let speedBoost={active:false,duration:0};
let walkFrame=0,walkT=0;  // speed boost from livro item
let lastTime=0,dt=1;
let paused=false;
let menu_btns={};
let game_btns={};
let intro_btns={};
let introSlide=0, introSlideX=0, introTarget=0;

const BGM=[
  new Audio('assets/soundtrack/brasil.mp3'),
  new Audio('assets/soundtrack/portugal.mp3'),
  new Audio('assets/soundtrack/mexico.mp3'),
];
BGM.forEach(a=>{a.loop=true;a.volume=0.5;});
// bgm é sempre a faixa da fase atual
function bgmPlay(){
  const a=BGM[phase-1]||BGM[0];
  BGM.forEach(x=>{x.pause();x.currentTime=0;});
  a.play().catch(()=>{});
}
function bgmStop(){BGM.forEach(a=>{a.pause();a.currentTime=0;});}
function startPhaseIntro(){phaseIntroT=0;bgmPlay();state=ST.PHASE_INTRO;}

function init(){
  score=0;dist=0;spd=5.2;  // score será calculado de dist em km
  obsT=0;obsI=90;    // obstáculos
  itmT=60;itmI=140;  // itens — menos frequentes que obstáculos
  shield=false;shT=0;flash=false;flashT=0;bgOff=0;starMode=false;starT=0;toast='';toastT=0;
  speedBoost={active:false,duration:0};
  walkFrame=0;walkT=0;
  obs=[];its=[];parts=[];
  pl={lane:1,x:LANE.px[1],y:LY[1]-PH,vy:0,jOff:0,
      jumping:false,attacking:false,atT:0,hitT:0,lives:3,dead:false};
  paused=false;
}

/* ── BACKGROUND ──────────────────────────── */
function drawBG(){
  // Background parallax horizontal — revela até 600km
  const skyH=LANE.roadY-HUD_H;
  const bcKey=phase===3&&rdy('bc3')?'bc3':phase===2&&rdy('bc2')?'bc2':'bc';
  if(rdy(bcKey)){
    const ih=IMG[bcKey].naturalHeight,iw=IMG[bcKey].naturalWidth;
    const scale=skyH/ih, tw=iw*scale;
    const maxScroll=Math.max(0,tw-W);
    const scrollX=Math.min(bgOff*BG_SPD,maxScroll);
    ctx.drawImage(IMG[bcKey],-scrollX,HUD_H,tw,skyH);
  } else {
    const g=ctx.createLinearGradient(0,HUD_H,0,LANE.roadY);
    g.addColorStop(0,'#1565C0');g.addColorStop(0.5,'#42A5F5');g.addColorStop(1,'#B3E5FC');
    ctx.fillStyle=g;ctx.fillRect(0,HUD_H,W,skyH);
    drawBasilica(W*0.62,HUD_H+55);
  }

  // Piso tileado por lane (parallax próprio)
  drawFloor();
}

function drawFloor(){
  // Um único bloco cobre todas as lanes — de LANE.roadY até CTL_Y
  const fy=LANE.roadY, fh=CTL_Y-fy;
  if(rdy('bf')){
    const iw=IMG.bf.naturalWidth,ih=IMG.bf.naturalHeight;
    const scale=fh/ih, tw=iw*scale;
    const off=(bgOff*FLOOR_SPD)%tw;
    for(let x=-off;x<W+tw;x+=tw)
      ctx.drawImage(IMG.bf,x,fy,tw+1,fh);
  } else {
    // Fallback: asfalto escuro com linhas tracejadas nas divisões de lane
    ctx.fillStyle='#2a2a2a';ctx.fillRect(0,fy,W,fh);
    ctx.strokeStyle='rgba(255,255,255,0.55)';
    ctx.setLineDash([28,18]);ctx.lineWidth=3;
    const off=bgOff%46;
    // linha entre lane 0 e 1, e entre lane 1 e 2
    [LANE.y[0]+(LANE.y[1]-LANE.y[0])/2, LANE.y[1]+(LANE.y[2]-LANE.y[1])/2].forEach(ly=>{
      ctx.beginPath();ctx.moveTo(-off,ly);ctx.lineTo(W+46,ly);ctx.stroke();
    });
    ctx.setLineDash([]);
    // borda superior da estrada
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,fy);ctx.lineTo(W,fy);ctx.stroke();
  }
}

function drawBasilica(bx,by){
  ctx.fillStyle='rgba(10,20,60,0.65)';
  ctx.beginPath();ctx.arc(bx,by+62,58,Math.PI,0);ctx.fill();
  ctx.fillRect(bx-58,by+62,116,46);
  ctx.fillRect(bx-102,by+34,24,84);ctx.beginPath();ctx.arc(bx-90,by+34,12,Math.PI,0);ctx.fill();
  ctx.fillRect(bx+78,by+34,24,84); ctx.beginPath();ctx.arc(bx+90,by+34,12,Math.PI,0);ctx.fill();
}

/* ── PLAYER ──────────────────────────────── */
function drawPlayer(){
  const dy=pl.y+pl.jOff, dx=pl.x-PW/2;
  if(shield){
    ctx.save();ctx.globalAlpha=0.35+0.15*Math.sin(Date.now()/140);
    ctx.strokeStyle='#00BFFF';ctx.lineWidth=5;
    ctx.beginPath();ctx.ellipse(pl.x,dy+PH/2,PW*0.62,PH*0.54,0,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  const sk=pl.dead?'pd':pl.hitT?'ph':pl.attacking?'pa':pl.jumping?'pj':WALK_KEYS[walkFrame];
  if(rdy(sk)){
    ctx.drawImage(IMG[sk],dx,dy,PW,PH);
  } else {
    ctx.fillStyle=pl.hitT?'#F44336':pl.attacking?'#FF9800':'#2196F3';
    ctx.fillRect(dx,dy,PW,PH);
    ctx.fillStyle='#fff';ctx.fillRect(dx+10,dy+14,10,10);ctx.fillRect(dx+36,dy+14,10,10);
    ctx.fillStyle='#000';ctx.fillRect(dx+13,dy+17,5,5);ctx.fillRect(dx+39,dy+17,5,5);
  }
  if(starMode){
    ctx.save();ctx.globalAlpha=0.2+0.2*Math.abs(Math.sin(Date.now()/70));
    ctx.fillStyle='#FFD700';
    ctx.beginPath();ctx.ellipse(pl.x,dy+PH/2,PW*0.62,PH*0.54,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

/* ── OBSTACLES ───────────────────────────── */
const OHINTS={a:'↑ PULE',b:'⚡ ATAQUE',c:'↕ DESVIE'};
function drawObs(o){
  const[ow,oh]=OS[o.type];
  const yOff=o.type==='a'?14:0; // buraco fica mais baixo (sobrepõe o asfalto)
  const ox=o.x-ow/2, oy=LY[o.lane]-oh+yOff;
  const k='o'+o.type;
  if(rdy(k)){
    ctx.drawImage(IMG[k],ox,oy,ow,oh);
  } else {
    if(o.type==='a'){
      ctx.fillStyle='#111';
      ctx.beginPath();ctx.ellipse(o.x,LY[o.lane]+6,ow/2,14,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();
    } else if(o.type==='b'){
      ctx.fillStyle='#C62828';ctx.fillRect(ox,oy,ow,oh);
      ctx.fillStyle='#EF9A9A';ctx.fillRect(ox+4,oy+4,ow-8,8);
    } else {
      ctx.fillStyle='#607D8B';ctx.fillRect(ox,oy,ow,oh);
      ctx.fillStyle='#FFD600';ctx.beginPath();ctx.arc(o.x,oy,ow/2+5,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#fff';ctx.font="9px 'Press Start 2P'";ctx.textAlign='center';
    ctx.fillText(OHINTS[o.type],o.x,oy-5);
  }
}

/* ── ITEMS ───────────────────────────────── */
function drawItem(it){
  const bob=Math.sin(Date.now()/300+it.phase)*5;
  const ix=it.x-IW/2, iy=LY[it.lane]-IH-16+bob;
  const k=it.type==='livro'?'il':it.type==='escudo'?'ie':'is';
  if(rdy(k)){ctx.drawImage(IMG[k],ix,iy,IW,IH);}
  else{
    ctx.save();ctx.translate(it.x,iy+IH/2);
    if(it.type==='livro'){
      ctx.fillStyle='#1976D2';ctx.fillRect(-15,-15,30,30);
      ctx.fillStyle='#fff';ctx.fillRect(-2,-11,4,22);
    } else if(it.type==='escudo'){
      ctx.fillStyle='#388E3C';
      ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(15,-8);ctx.lineTo(15,5);
      ctx.lineTo(0,17);ctx.lineTo(-15,5);ctx.lineTo(-15,-8);ctx.closePath();ctx.fill();
    } else {
      ctx.fillStyle='#FDD835';star(0,0,5,16,7);
    }
    ctx.restore();
  }
}
function star(cx,cy,sp,ro,ri){
  let r=-Math.PI/2,s=Math.PI/sp;
  ctx.beginPath();ctx.moveTo(cx+Math.cos(r)*ro,cy+Math.sin(r)*ro);
  for(let i=0;i<sp;i++){r+=s;ctx.lineTo(cx+Math.cos(r)*ri,cy+Math.sin(r)*ri);
    r+=s;ctx.lineTo(cx+Math.cos(r)*ro,cy+Math.sin(r)*ro);}
  ctx.closePath();ctx.fill();
}

/* ── PARTICLES ───────────────────────────── */
function spawnP(x,y,c,n=8){
  for(let i=0;i<n;i++){
    const a=(Math.PI*2*i/n)+Math.random()*.5,s=2+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:3+Math.random()*4,c,life:1});
  }
}
function updP(){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.2*dt;p.life-=.04*dt;if(p.life<=0)parts.splice(i,1);}}
function drawP(){
  if(!parts.length)return;
  ctx.save();
  for(const p of parts){ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

/* ── CONTROLS UI ─────────────────────────── */
function drawCtl(){
  ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,CTL_Y,W,CTL_H);
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,CTL_Y);ctx.lineTo(W,CTL_Y);ctx.stroke();
}

/* ── HUD ─────────────────────────────────── */
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,HUD_H);
  // Distância (km)
  ctx.fillStyle='#FFD700';ctx.font="15px 'Press Start 2P'";ctx.textAlign='left';
  ctx.fillText('🛣 '+Math.floor(score)+' km',14,38);
  // Corações (sem label "Vidas")
  ctx.textAlign='right';
  ctx.font="18px 'Press Start 2P'";ctx.fillStyle='#E53935';
  for(let i=0;i<pl.lives;i++){
    ctx.fillText('♥',W-72-i*26,40);
  }
  // Botão pause
  ctx.fillStyle='rgba(255,215,0,0.4)';ctx.lineWidth=1.5;ctx.strokeStyle='#FFD700';
  ctx.beginPath();ctx.roundRect(W-50,8,44,40,8);ctx.fill();ctx.stroke();
  ctx.fillStyle='#FFD700';ctx.font="12px 'Press Start 2P'";ctx.textAlign='center';
  ctx.fillText('⏸',W-28,32);
  game_btns.pause={x:W-50,y:8,w:44,h:40};
  if(flash){ctx.fillStyle='rgba(255,0,0,0.3)';ctx.fillRect(0,0,W,H);}
}

// Efeitos de item sobrepostos ao jogo (não no HUD)
function drawItemEffects(){
  const cy=CTL_Y+CTL_H/2+6; // centro da área inferior
  ctx.save();ctx.textAlign='center';ctx.font="12px 'Press Start 2P'";

  if(toastT>0){
    ctx.globalAlpha=Math.min(1,toastT/20);
    ctx.fillStyle='#FFFFFF';
    ctx.fillText(toast,W/2,cy);
  }

  if(speedBoost?.active||shield||starMode){
    ctx.globalAlpha=1;
    let yOff=toastT>0?-18:0;
    if(speedBoost?.active){
      ctx.fillStyle='#FFB347';ctx.fillText('⚡ ACELERADO',W/2,cy+yOff);yOff+=20;
    }
    if(shield){
      ctx.fillStyle='#7ED6F5';ctx.fillText('🛡 Dom da Fortaleza',W/2,cy+yOff);yOff+=20;
    }
    if(starMode){
      ctx.fillStyle='#FFE566';ctx.fillText('✨ Intercessão de Maria',W/2,cy+yOff);
    }
  }

  ctx.restore();
}

/* ── COLLISION ───────────────────────────── */
function overlap(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function checkCols(){
  const px=pl.x-PW/2+8,py=pl.y+pl.jOff+8,pw=PW-16,ph=PH-16;
  // Items
  for(let i=its.length-1;i>=0;i--){
    const it=its[i];
    if(it.lane!==pl.lane)continue;
    const ix=it.x-IW/2,iy=LY[it.lane]-IH-16;
    if(overlap(px,py,pw,ph,ix,iy,IW,IH)){
      if(it.type==='livro'){if(pl.lives<3){pl.lives++;spawnP(it.x,iy+IH/2,'#E53935',10);}toast='📖 Vida nova';toastT=90;}
      if(it.type==='estrela'){starMode=true;starT=360;spawnP(it.x,iy+IH/2,'#FFD700',16);}  // Limpa todos obstáculos na tela
      if(it.type==='escudo'){shield=true;shT=300;spawnP(it.x,iy+IH/2,'#4CAF50',12);}
      its.splice(i,1);
    }
  }
  // Obstacles
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];
    if(o.lane!==pl.lane)continue;
    const[ow,oh]=OS[o.type];
    const ox=o.x-ow/2+6,oy=LY[o.lane]-oh+6;
    if(!overlap(px,py,pw,ph,ox,oy,ow-12,oh-12))continue;
    let ok=starMode;
    if(o.type==='a')ok=ok||pl.jumping;
    if(o.type==='b')ok=ok||pl.attacking;
    if(o.type==='c')ok=ok||o.lane!==pl.lane;
    if(ok){
      spawnP(o.x,LY[o.lane]-oh/2,'#FFD700',12);
      if(o.type==='b'){const tys=['livro','escudo','estrela'];its.push({x:o.x,lane:o.lane,type:tys[Math.floor(Math.random()*tys.length)],phase:0});}
      obs.splice(i,1);
    } else if(shield){
      shield=false;shT=0;spawnP(pl.x,pl.y+PH/2,'#00BFFF',12);obs.splice(i,1);
    } else if(pl.hitT>0){
      obs.splice(i,1); // invencível — remove obstáculo sem dano
    } else {
      pl.lives--;pl.hitT=44;flash=true;flashT=18;
      spawnP(pl.x,pl.y+PH/2,'#F44336',10);obs.splice(i,1);
      if(pl.lives<=0){pl.dead=true;bgmStop();setTimeout(()=>{init();startPhaseIntro();},1200);}
    }
  }
}

/* ── UPDATE ──────────────────────────────── */
function update(){
  if(state!==ST.PLAY||pl.dead)return;
  bgOff+=spd*dt;dist+=spd*dt;
  score=dist/60;
  if(score>=600){bgmStop();state=ST.PHASE_WIN;return;}
  
  // Base speed + speed boost
  let baseSpd=6.5+Math.min(dist/6000,5);
  spd=speedBoost.active ? baseSpd*1.4 : baseSpd;  // 40% mais rápido com boost

  // Distância mínima entre qualquer objeto e a borda direita antes de spawnar
  const GAP=220;
  let rightmost=-Infinity;
  for(const o of obs)if(o.x>rightmost)rightmost=o.x;
  const starActive=starMode&&starT>80;
  const obsCanSpawn=starActive?rightmost<W-100:rightmost<W-GAP;
  for(const i of its)if(i.x>rightmost)rightmost=i.x;
  const clearToSpawn=rightmost<W-GAP;

  obsT+=dt;
  if(obsT>=(starActive?25:obsI)&&obsCanSpawn){
    obs.push({x:W+60,lane:Math.floor(Math.random()*LC),type:starMode?'c':['a','b','c'][Math.floor(Math.random()*3)]});
    obsT=0;if(!starMode)obsI=Math.max(85,obsI-.20);
  }

  itmT+=dt;
  if(!starMode&&itmT>=itmI&&clearToSpawn&&Math.random()<0.35){
    const tys=['escudo','escudo','livro','estrela'];
    if(pl.lives===1)tys.push('livro');
    its.push({x:W+60,lane:Math.floor(Math.random()*LC),
      type:tys[Math.floor(Math.random()*tys.length)],phase:Math.random()*Math.PI*2});
    itmT=0;itmI=Math.max(90,itmI-.30);
  }
  
  // Update speed boost
  if(speedBoost.active){
    speedBoost.duration-=dt;
    if(speedBoost.duration<=0)speedBoost.active=false;
  }

  // Smooth lane Y + perspectiva X (dt-aware lerp)
  const lf=1-Math.pow(0.82,dt);
  pl.y+=(LY[pl.lane]-PH-pl.y)*lf;
  pl.x+=(LANE.px[pl.lane]-pl.x)*lf;

  // Jump physics
  if(pl.jumping){
    pl.jOff+=pl.vy*dt;pl.vy+=GR*dt;
    if(pl.jOff>=0){pl.jOff=0;pl.vy=0;pl.jumping=false;}
  }

  if(pl.atT>0){pl.atT-=dt;if(pl.atT<=0){pl.atT=0;pl.attacking=false;}}
  if(pl.hitT>0){pl.hitT-=dt;if(pl.hitT<0)pl.hitT=0;}
  if(flashT>0){flashT-=dt;if(flashT<=0){flashT=0;flash=false;}}
  if(shield&&(shT-=dt)<=0)shield=false;
  if(starMode&&(starT-=dt)<=0)starMode=false;
  if(toastT>0){toastT-=dt;if(toastT<0)toastT=0;}

  // Animação de corrida — avança apenas quando no chão, sem ataque/dano
  if(!pl.jumping&&!pl.attacking&&pl.hitT<=0&&!pl.dead){
    walkT+=dt;
    if(walkT>=WALK_SPD){walkT=0;walkFrame=(walkFrame+1)%WALK_KEYS.length;}
  }

  for(let i=obs.length-1;i>=0;i--){obs[i].x-=spd*dt;if(obs[i].x<-90)obs.splice(i,1);}
  for(let i=its.length-1;i>=0;i--){its[i].x-=spd*dt;if(its[i].x<-50)its.splice(i,1);}
  checkCols();updP();
}

function drawOneSlide(slideIdx, ox){
  const rx=32,ry=230,rw=W-64,rh=370;
  const cx=W/2+ox;

  // Popup fundo
  ctx.fillStyle='#A05E00';ctx.beginPath();ctx.roundRect(rx+ox-5,ry-5,rw+10,rh+10,22);ctx.fill();
  ctx.fillStyle='#F0A020';ctx.beginPath();ctx.roundRect(rx+ox-3,ry-3,rw+6,rh+6,20);ctx.fill();
  ctx.fillStyle='#F5E6C8';ctx.beginPath();ctx.roundRect(rx+ox,ry,rw,rh,18);ctx.fill();

  ctx.textAlign='center';
  // Clip interno
  ctx.save();
  ctx.beginPath();ctx.roundRect(rx+ox,ry,rw,rh,18);ctx.clip();

  if(slideIdx===0){
    ctx.fillStyle='#2B1000';ctx.font="15px 'Press Start 2P'";ctx.fillText('Ajude o',cx,ry+72);
    ctx.fillStyle='#CC0000';ctx.font="24px 'Press Start 2P'";ctx.fillText('Todinho',cx,ry+105);
    ctx.fillStyle='#0033BB';ctx.font="21px 'Press Start 2P'";ctx.fillText('DE MARIA',cx,ry+138);
    ctx.fillStyle='#2B1000';ctx.font="15px 'Press Start 2P'";
    ctx.fillText('a completar',cx,ry+182);
    ctx.fillText('a peregrinação',cx,ry+207);
    ctx.fillText('pelos países',cx,ry+232);
  } else {
    ctx.fillStyle='#2B1000';ctx.font="13px 'Press Start 2P'";ctx.fillText('Como jogar:',cx,ry+65);
    ctx.font="9px 'Press Start 2P'";
    const tips=[
      ['👆 Toque para pular',       ry+110],
      ['↕ Arraste p/ cima ou baixo',ry+148],
      ['  para mudar de faixa',     ry+166],
      ['👉 Arraste p/ o lado',      ry+204],
      ['  para quebrar caixas',     ry+222],
    ];
    tips.forEach(([t,y])=>{ctx.fillStyle='#2B1000';ctx.fillText(t,cx,y);});

    const bx=cx-110,by=ry+rh-70,bw=220,bh=46;
    ctx.fillStyle='#A05E00';ctx.beginPath();ctx.roundRect(bx-3,by-3,bw+6,bh+6,24);ctx.fill();
    ctx.fillStyle='#FFB800';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,22);ctx.fill();
    ctx.fillStyle='#2B1000';ctx.font="12px 'Press Start 2P'";
    ctx.fillText('INICIAR',cx,by+bh/2+5);
    intro_btns.play={x:bx,y:by,w:bw,h:bh};
  }
  ctx.restore();

  // Sprite na camada de cima (acima e sobre o popup)
  const sprKey=slideIdx===0?'pj':'pa';
  if(rdy(sprKey)){
    const nat=IMG[sprKey].naturalWidth/IMG[sprKey].naturalHeight;
    const sw=120,sh=sw/nat;
    ctx.drawImage(IMG[sprKey],cx-sw/2,ry-sh*0.68,sw,sh);
  }
}

function drawIntro(){
  intro_btns={};
  ctx.fillStyle='#1AACE8';ctx.fillRect(0,0,W,H);

  // Animação de slide (lerp)
  introSlideX+=(introTarget-introSlideX)*Math.min(0.14*dt,1);
  if(Math.abs(introSlideX-introTarget)<0.5){
    introSlideX=introTarget;
    introSlide=introTarget<-W/2?1:0;
  }

  // Clip canvas para slides não extravasarem
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  drawOneSlide(0, Math.round(introSlideX));
  drawOneSlide(1, Math.round(introSlideX)+W);
  ctx.restore();

  // Dots (fixos, fora do clip dos slides)
  const ry=230,rh=370,dotY=ry+rh-22;
  const dotProg=-introSlideX/W; // 0→slide0, 1→slide1
  [0,1].forEach(i=>{
    ctx.beginPath();ctx.arc(W/2-14+i*28,dotY,7,0,Math.PI*2);
    ctx.fillStyle=Math.abs(i-dotProg)<0.5?'#D4860A':'rgba(180,140,80,0.45)';ctx.fill();
  });
}

function handleIntroClick(c){

function drawFlag(cx,cy,w,h){

/* ── INPUT ───────────────────────────────── */
function laneUp(){if(pl.lane>0)   pl.lane--;}
function laneDn(){if(pl.lane<LC-1)pl.lane++;}
function doJump(){if(!pl.jumping){pl.jumping=true;pl.vy=JVY;}}
function doAtk() {if(!pl.attacking){pl.attacking=true;pl.atT=24;}}

function togglePause(){
  if(state===ST.PLAY){
    state=ST.PAUSED;BGM[phase-1].pause();
  } else if(state===ST.PAUSED){
    state=ST.PLAY;BGM[phase-1].play().catch(()=>{});
  }
}

function hitBtn(b,x,y){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}
function toC(cx,cy){const r=cv.getBoundingClientRect();return{x:(cx-r.left)*W/r.width,y:(cy-r.top)*H/r.height};}

/* ── HANDLE BUTTON CLICKS BY SCREEN ──────────────────────── */
function handleMenuClick(c){
  if(menu_btns.play&&hitBtn(menu_btns.play,c.x,c.y)){
    introSlide=0;introSlideX=0;introTarget=0;state=ST.INTRO;return;
  }
}

function handleHelpClick(c){
  if(menu_btns.back&&hitBtn(menu_btns.back,c.x,c.y)){
    state=ST.MENU;return;
  }
}

function handleGameClick(c){
  if(game_btns.pause&&hitBtn(game_btns.pause,c.x,c.y)){
    togglePause();return;
  }
}

function handlePausedClick(c){
  if(game_btns.resume&&hitBtn(game_btns.resume,c.x,c.y)){
    state=ST.PLAY;BGM[phase-1].play().catch(()=>{});return;
  }
  if(game_btns.pauseMenu&&hitBtn(game_btns.pauseMenu,c.x,c.y)){
    if(score>hs){hs=score;localStorage.setItem('tdm_hs',Math.floor(hs));}
    state=ST.MENU;bgmStop();return;
  }
}

function handleGameOverClick(c){
  if(game_btns.restart&&hitBtn(game_btns.restart,c.x,c.y)){
    if(score>hs){hs=score;localStorage.setItem('tdm_hs',Math.floor(hs));}
    phase=1;init();startPhaseIntro();return;
  }
  if(game_btns.menu&&hitBtn(game_btns.menu,c.x,c.y)){
    if(score>hs){hs=score;localStorage.setItem('tdm_hs',Math.floor(hs));}
    state=ST.MENU;return;
  }
}

let sc=null; // swipe start in canvas coords
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0],c=toC(t.clientX,t.clientY);
  
  // Handle menu/help clicks
  if(state===ST.MENU){handleMenuClick(c);sc=null;return;}
  if(state===ST.PHASE_INTRO){sc=null;return;}
  if(state===ST.INTRO){handleIntroClick(c);sc=null;return;}
  if(state===ST.HELP){handleHelpClick(c);sc=null;return;}
  if(state===ST.PAUSED){handlePausedClick(c);sc=null;return;}
  if(state===ST.PHASE_WIN){handlePhaseWinClick(c);sc=null;return;}
  if(state===ST.OVER){handleGameOverClick(c);sc=null;return;}
  if(state===ST.WIN){handleGameOverClick(c);sc=null;return;}
  
  // Handle in-game clicks
  if(state===ST.PLAY&&!pl.dead){
    handleGameClick(c);
    sc=c;
  }
},{passive:false});

cv.addEventListener('touchend',e=>{
  e.preventDefault();
  if(!sc||state!==ST.PLAY||pl.dead){sc=null;return;}
  const t=e.changedTouches[0],c=toC(t.clientX,t.clientY);
  {
    const dx=c.x-sc.x, dy=c.y-sc.y;
    const moved=Math.sqrt(dx*dx+dy*dy);
    if(moved<22){                                          // tap → pulo
      doJump();
    } else if(Math.abs(dx)>Math.abs(dy)&&dx>30){          // arrastar direita → ataque
      doAtk();
    } else if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>28){ // arrastar cima/baixo → lane
      if(dy<0)laneUp();else laneDn();
    }
  }
  sc=null;
},{passive:false});

cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const c={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
  
  if(state===ST.MENU){handleMenuClick(c);return;}
  if(state===ST.PHASE_INTRO)return;
  if(state===ST.INTRO){handleIntroClick(c);return;}
  if(state===ST.HELP){handleHelpClick(c);return;}
  if(state===ST.PAUSED){handlePausedClick(c);return;}
  if(state===ST.PHASE_WIN){handlePhaseWinClick(c);return;}
  if(state===ST.OVER){handleGameOverClick(c);return;}
  if(state===ST.WIN){handleGameOverClick(c);return;}
  if(state===ST.PLAY){handleGameClick(c);return;}
});

document.addEventListener('keydown',e=>{
  // Pause/Resume with P or ESC
  if((e.key==='p'||e.key==='P'||e.key==='Escape')&&(state===ST.PLAY||state===ST.PAUSED)){
    togglePause();e.preventDefault();return;
  }
  
  // Start game or other menu actions
  if(state===ST.MENU){
    if(e.key===' '||e.key==='Enter'){introSlide=0;state=ST.INTRO;}
    e.preventDefault();return;
  }

  if(state===ST.INTRO||state===ST.HELP||state===ST.PAUSED||state===ST.OVER||state===ST.PHASE_INTRO||state===ST.PHASE_WIN){
    e.preventDefault();return;
  }
  
  if(state!==ST.PLAY){return;}
  if(pl.dead)return;
  if(e.key==='ArrowUp'  ||e.key==='w')laneUp();
  if(e.key==='ArrowDown'||e.key==='s')laneDn();
  if(e.key===' '||e.key==='z')doJump();
  if(e.key==='x'||e.key==='Enter')doAtk();
  e.preventDefault();
});

/* ── FLOW ────────────────────────────────── */

/* ── MAIN LOOP ───────────────────────────── */
function frame(ts){
  dt=lastTime?Math.min((ts-lastTime)/(1000/60),2.5):1;
  lastTime=ts;
  ctx.clearRect(0,0,W,H);
  
  if(state===ST.MENU){
    drawMenu();
  } else if(state===ST.PHASE_INTRO){
    drawPhaseIntro();
    phaseIntroT+=dt;
    if(phaseIntroT>=120){phaseIntroT=0;state=ST.PLAY;}
  } else if(state===ST.INTRO){
    drawIntro();
  } else if(state===ST.HELP){
    drawHelp();
  } else if(state===ST.PAUSED){
    // Draw game in background, then pause overlay
    update();
    drawBG();
    for(let lane=0;lane<LC;lane++){
      its.filter(it=>it.lane===lane).forEach(drawItem);
      obs.filter(o=>o.lane===lane).forEach(drawObs);
      if(pl.lane===lane) drawPlayer();
    }
    drawP();drawItemEffects();
    drawHUD();
    drawCtl();
    drawPaused();
  } else if(state===ST.OVER){
    // Draw final game frame, then game over screen
    if(!pl.dead){
      drawBG();
      for(let lane=0;lane<LC;lane++){
        its.filter(it=>it.lane===lane).forEach(drawItem);
        obs.filter(o=>o.lane===lane).forEach(drawObs);
        if(pl.lane===lane) drawPlayer();
      }
      drawP();
    }
    drawHUD();
    drawCtl();
    drawOver();
  } else if(state===ST.PHASE_WIN){
    drawBG();drawHUD();drawPhaseWin();
  } else if(state===ST.WIN){
    drawBG();
    for(let lane=0;lane<LC;lane++){
      its.filter(it=>it.lane===lane).forEach(drawItem);
      obs.filter(o=>o.lane===lane).forEach(drawObs);
      if(pl.lane===lane) drawPlayer();
    }
    drawP();drawItemEffects();drawHUD();drawCtl();drawWin();
  } else {
    // ST.PLAY
    update();
    drawBG();
    // Desenha por lane do mais longe (0) ao mais perto (2) — profundidade correta
    for(let lane=0;lane<LC;lane++){
      its.filter(it=>it.lane===lane).forEach(drawItem);
      obs.filter(o=>o.lane===lane).forEach(drawObs);
      if(pl.lane===lane) drawPlayer();
    }
    drawP();drawItemEffects();
    drawHUD();
    drawCtl();
  }

  requestAnimationFrame(frame);
}

(function wait(){
  if(loaded>=TOTAL&&document.fonts.check("15px 'Press Start 2P'")){frame();return;}
  ctx.fillStyle='#0d1b2a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#FFD700';ctx.font="14px 'Press Start 2P'";ctx.textAlign='center';
  ctx.fillText('Carregando...',W/2,H/2-14);
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(W/2-80,H/2+8,160,10);
  ctx.fillStyle='#FFD700';ctx.fillRect(W/2-80,H/2+8,160*(loaded/TOTAL),10);
  setTimeout(wait,80);
})();
</script>
